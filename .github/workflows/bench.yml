name: bench-ab
on:
  push:
    branches: ['bench/**']
jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      BASE: 86fd83eba1a7872340b881dea86fdcb81dcaf25a
      EXAMPLE: gsc_vm_bench
      PKG: sim
      REPS: '5'
      PERF_REPS: '3'
      ORDER_PROBE: '1'
    steps:
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: System packages (docs/BUILD.md)
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ pkg-config libx11-dev libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev linux-tools-common linux-tools-$(uname -r) || sudo apt-get install -y linux-tools-generic
      - name: Build head and base (play profile, symbols kept)
        env:
          CARGO_PROFILE_PLAY_DEBUG: line-tables-only
          CARGO_PROFILE_PLAY_STRIP: none
          RUSTFLAGS: -C force-frame-pointers=yes
        run: |
          mkdir -p /tmp/ab
          cp bench-args.txt /tmp/ab/args.txt
          cp crates/$PKG/examples/$EXAMPLE.rs /tmp/ab/example.rs
          extra=()
          if [ "$ORDER_PROBE" = 1 ]; then
            cp -r bench-probe /tmp/ab/probe
            python3 /tmp/ab/probe/inject_vm_order_probe.py "$GITHUB_WORKSPACE"
            extra=(--example gsc_thread_order_probe)
          fi
          cargo build --profile play -p $PKG --example $EXAMPLE "${extra[@]}"
          cp target/play/examples/$EXAMPLE /tmp/ab/head
          if [ "$ORDER_PROBE" = 1 ]; then
            target/play/examples/gsc_thread_order_probe | tee /tmp/ab/head-order.txt
          fi
          git rev-parse HEAD > /tmp/ab/head.sha
          git worktree add --detach /tmp/ab/base-src "$BASE"
          mkdir -p /tmp/ab/base-src/crates/$PKG/examples
          cp /tmp/ab/example.rs /tmp/ab/base-src/crates/$PKG/examples/$EXAMPLE.rs
          if [ "$ORDER_PROBE" = 1 ]; then
            python3 /tmp/ab/probe/inject_vm_order_probe.py /tmp/ab/base-src
          fi
          (cd /tmp/ab/base-src && CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" cargo build --profile play -p $PKG --example $EXAMPLE "${extra[@]}")
          cp target/play/examples/$EXAMPLE /tmp/ab/base
          if [ "$ORDER_PROBE" = 1 ]; then
            target/play/examples/gsc_thread_order_probe | tee /tmp/ab/base-order.txt
          fi
          echo "$BASE" > /tmp/ab/base.sha
      - name: Interleaved runs
        run: |
          cd /tmp/ab
          while IFS= read -r args; do
            [ -z "$args" ] && continue
            for rep in $(seq 1 $REPS); do
              if [ $((rep % 2)) = 1 ]; then order="base head"; else order="head base"; fi
              for v in $order; do
                echo "@@ $v rep=$rep args=$args"
                taskset -c 1 ./$v $args
              done
            done
          done < args.txt 2>&1 | tee runs.txt
      - name: Profile
        run: |
          cd /tmp/ab
          sudo sysctl -w kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0
          args=$(head -1 args.txt)
          for rep in $(seq 1 "$PERF_REPS"); do
            if [ $((rep % 2)) = 1 ]; then order="base head"; else order="head base"; fi
            for v in $order; do
              echo "### $v rep=$rep args=$args"
              perf record -F 1999 -g -o "$v-$rep.data" -- taskset -c 1 ./$v $args > /dev/null 2>&1
              echo "--- self time"
              perf report -i "$v-$rep.data" --stdio --no-children --sort symbol --percent-limit 0.5 > "$v-$rep.report.txt" 2>/dev/null
              awk '/^ +[0-9]/ { gsub(/[ \t]+/, " "); print; if (++n == 60) exit }' "$v-$rep.report.txt"
              perf report -i "$v-$rep.data" --stdio --no-children --sort symbol --symbol-filter=Runtime -g caller,0.5,callee,function,percent > "$v-$rep.runtime.txt" 2>/dev/null
              perf report -i "$v-$rep.data" --stdio --no-children --sort symbol --symbol-filter=clone -g caller,0.5,callee,function,percent > "$v-$rep.clone.txt" 2>/dev/null
            done
          done 2>&1 | tee profile.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench
          path: |
            /tmp/ab/runs.txt
            /tmp/ab/profile.txt
            /tmp/ab/head.sha
            /tmp/ab/base.sha
            /tmp/ab/*-order.txt
            /tmp/ab/*.data
            /tmp/ab/*.report.txt
            /tmp/ab/*.runtime.txt
            /tmp/ab/*.clone.txt
