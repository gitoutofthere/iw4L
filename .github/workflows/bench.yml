name: bench
on:
  push:
    branches: ['bench/**']
jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      - name: System packages (docs/BUILD.md)
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ pkg-config libx11-dev libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - name: Build the bench (play profile)
        run: cargo build --profile play -p sim --example gsc_vm_bench
      - name: Run
        run: |
          nproc; lscpu | grep 'Model name'
          b=./target/play/examples/gsc_vm_bench
          for args in "16 40 4 4 2000 1200" "32 40 4 4 2000 600" "16 80 8 6 4000 600"; do
            for i in 1 2 3; do
              echo "### args=$args run=$i"
              $b $args 2> >(grep 'gsc census' | tail -1 >&1)
            done
          done 2>&1 | tee bench.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench
          path: bench.txt
